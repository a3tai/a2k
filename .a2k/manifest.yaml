$schema: https://a3t.ai/a2k/schemas/v0.1/manifest.schema.json
apiVersion: a2k.a3t.ai/v0alpha1
kind: ProjectBootstrap
metadata:
  id: https://a3t.ai/a2k/projects/a2k
  name: a2k
  title: A2K protocol and a3t CLI
  owners:
    - https://github.com/a3tai/a2k
  classification: internal
spec:
  roots: []
  profiles: [core, bootstrap, mcp]
  policy:
    remoteFetch: disabled
    mutation: proposal
x-connectors:
  mcpServers:
    context7:
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY:
          env: CONTEXT7_API_KEY
          op: op://KarunaBot/Environment/MCP/CONTEXT7_API_KEY
    exa:
      transport: http
      url: https://mcp.exa.ai/mcp
      headers:
        Authorization:
          env: EXA_API_KEY
          op: op://KarunaBot/Environment/MCP/EXA_API_KEY
          scheme: bearer
    firecrawl:
      transport: stdio
      command: npx
      args: [-y, firecrawl-mcp]
      env:
        FIRECRAWL_API_KEY:
          env: FIRECRAWL_API_KEY
          op: op://KarunaBot/Environment/MCP/FIRECRAWL_API_KEY
    linear:
      transport: stdio
      command: npx
      args: [-y, "@linear/mcp-server"]
      env:
        LINEAR_API_KEY:
          env: LINEAR_API_KEY
          op: op://KarunaBot/Environment/MCP/LINEAR_API_KEY
    notion:
      transport: stdio
      command: npx
      args: [-y, "@notionhq/notion-mcp-server"]
      env:
        NOTION_TOKEN:
          env: NOTION_API_KEY
          op: op://KarunaBot/Environment/MCP/NOTION_API_KEY
    tavily:
      transport: http
      url: https://mcp.tavily.com/mcp/
      headers:
        Authorization:
          env: TAVILY_API_KEY
          op: op://KarunaBot/Environment/MCP/TAVILY_API_KEY
          scheme: bearer
