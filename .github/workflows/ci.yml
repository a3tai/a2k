name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install with dependency scripts disabled
        run: npm ci --ignore-scripts
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build and test
        run: npm test
      - name: Validate examples
        run: |
          node packages/validator/dist/cli.js examples/project-bootstrap/.a2k/manifest.yaml
          node packages/validator/dist/cli.js examples/organization-hub/.a2k/manifest.yaml
          node packages/validator/dist/cli.js examples/private-overlay/.a2k/manifest.yaml
