apiVersion: a2k.a3t.ai/v0alpha1
kind: ProjectBootstrap
metadata:
  id: https://example.com/a2k/projects/connectors
  name: connectors
  owners: [https://example.com/teams/platform]
  classification: internal
spec:
  roots: []
  profiles: [core, mcp]
  policy:
    remoteFetch: disabled
    mutation: proposal
x-connectors:
  mcpServers:
    context7:
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY:
          env: CONTEXT7_API_KEY
          op: op://Shared/LocalEnvironment/CONTEXT7_API_KEY
    linear:
      transport: stdio
      command: npx
      args: [-y, "@linear/mcp-server"]
      env:
        LINEAR_API_KEY:
          env: LINEAR_API_KEY
          op: op://Shared/LocalEnvironment/MCP/LINEAR_API_KEY
